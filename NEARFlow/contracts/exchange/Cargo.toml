[package]
name = "nearflow-perps"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uint = "0.10.0"
near-sdk = { version = "=5.28.0", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.28.0", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
